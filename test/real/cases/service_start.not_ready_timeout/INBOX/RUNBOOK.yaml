version: 1
receiver: uri
project: uri-runner
profile: audit
cwd: .
audit:
  server:
    cmd: node
    args:
      - test/real/fixtures/service/http-not-ready-server.js
    base_url: http://127.0.0.1:3011
    readiness:
      type: http
      path: /health
      timeout_ms: 1500
      interval_ms: 200
  checks:
    - name: smoke
      cmd: node
      args:
        - -e
        - console.log('service not ready smoke')
