version: 1
receiver: "uri"
project: "uri-runner-next"
profile: "scenario"
engine: "scenario"
cwd: "."
executableCtx:
  commands:
    roots:
      - "system"
steps:
  -
    id: "system_exec_success_1"
    stepId: "system_exec_success_1"
    kind: "command"
    index: 0
    command: "system.exec"
    commandRoot: "system"
    args:
      cmd: "node"
      args:
        - "-e"
        - "process.stdout.write('exec-ok\\n')"
scenario:
  steps:
    -
      id: "system_exec_success_1"
      stepId: "system_exec_success_1"
      kind: "command"
      index: 0
      command: "system.exec"
      commandRoot: "system"
      args:
        cmd: "node"
        args:
          - "-e"
          - "process.stdout.write('exec-ok\\n')"
