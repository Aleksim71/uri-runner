# config/scenario-command-registry.yaml
version: 1

defaults:
  on_unknown: classification_required
  generate_request: true
  execute_unknown: false

profiles:
  instant:
    description: "Шаг должен завершиться сразу"
  browser_session:
    description: "Управление browser session"
  browser_navigation:
    description: "Навигация и ожидание страницы"
  browser_diagnostics:
    description: "Сбор browser diagnostics"

named_commands:
  - id: system.echo
    group: system
    profile: instant
    notes: "Базовая встроенная команда system.echo"
    match:
      command: system.echo
    args_schema:
      required: [message]

  - id: project.git-status
    group: git
    profile: instant
    notes: "Проверить состояние git working tree"
    match:
      command: project.git-status
    args_schema:
      required: []
      optional: []

  - id: fs.ensure.dir
    group: fs
    profile: instant
    notes: "Ensure directory exists"
    match:
      command: fs.ensure.dir
    args_schema:
      required: [path]
      optional: []

  - id: fs.read.file
    group: fs
    profile: instant
    notes: "Read file content"
    match:
      command: fs.read.file
    args_schema:
      required: [path]
      optional: [encoding]

  - id: fs.write.file
    group: fs
    profile: instant
    notes: "Write file content"
    match:
      command: fs.write.file
    args_schema:
      required: [path]
      optional: [content, encoding]

  - id: fs.replace.file
    group: fs
    profile: instant
    notes: "Replace text in file"
    match:
      command: fs.replace.file
    args_schema:
      required: [path, search, replace]
      optional: [encoding]

  - id: fs.copy.path
    group: fs
    profile: instant
    notes: "Copy file or directory"
    match:
      command: fs.copy.path
    args_schema:
      required: [from, to]
      optional: []

  - id: fs.move.path
    group: fs
    profile: instant
    notes: "Move file or directory"
    match:
      command: fs.move.path
    args_schema:
      required: [from, to]
      optional: []

  - id: fs.delete.path.safe
    group: fs
    profile: instant
    notes: "Delete path inside cwd"
    match:
      command: fs.delete.path.safe
    args_schema:
      required: [path]
      optional: []

  - id: fs.archive.zip
    group: fs
    profile: instant
    notes: "Archive file or directory into zip"
    match:
      command: fs.archive.zip
    args_schema:
      required: [source, target]
      optional: []

  - id: fs.unpack.zip
    group: fs
    profile: instant
    notes: "Unpack zip archive"
    match:
      command: fs.unpack.zip
    args_schema:
      required: [archive, target]
      optional: []

  - id: fs.artifact.exists
    group: fs
    profile: instant
    notes: "Check path existence"
    match:
      command: fs.artifact.exists
    args_schema:
      required: [path]
      optional: []

browser_actions:
  - id: browser.session.start
    group: browser
    profile: browser_session
    notes: "Старт browser session"
    match:
      action: session.start
    args_schema:
      required: []
      optional: [headless, endpoint, host, port]

  - id: browser.page.open
    group: browser
    profile: browser_navigation
    notes: "Открыть страницу"
    match:
      action: page.open
    args_schema:
      required: [url]
      optional: [waitUntil, timeoutMs]

  - id: browser.page.wait
    group: browser
    profile: browser_navigation
    notes: "Подождать состояние страницы"
    match:
      action: page.wait
    args_schema:
      required: []
      optional: [waitUntil, timeoutMs]

  - id: browser.diagnostics.collect
    group: browser
    profile: browser_diagnostics
    notes: "Собрать diagnostics"
    match:
      action: diagnostics.collect
    args_schema:
      required: []
      optional: [includeConsole, includeNetwork]

  - id: browser.diagnostics.run
    group: browser
    profile: browser_diagnostics
    notes: "Синоним diagnostics.collect"
    match:
      action: diagnostics.run
    args_schema:
      required: []
      optional: [includeConsole, includeNetwork]

  - id: browser.session.stop
    group: browser
    profile: browser_session
    notes: "Остановить browser session"
    match:
      action: session.stop
    args_schema:
      required: []
      optional: [sessionId]
